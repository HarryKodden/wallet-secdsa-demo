name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  docker-web-wallet:
    name: Docker / GHCR (web-wallet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        id: image
        run: |
          owner_repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${owner_repo}/web-wallet" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web-wallet
          file: ./web-wallet/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web-wallet
          cache-to: type=gha,mode=max,scope=web-wallet

  # wallet-api2 needs a SECDSA-enabled waltid-identity checkout plus
  # secdsa-waltid-adapter (not in this repo). Configure repository variables:
  #   WALTID_IDENTITY_REPO   e.g. YourOrg/waltid-identity
  #   WALTID_IDENTITY_REF    optional, default main
  #   SECDSA_ADAPTER_REPO    e.g. YourOrg/secdsa-waltid-adapter
  #   SECDSA_ADAPTER_REF     optional, default main
  # For private dependency repos, add secret DEPENDENCY_TOKEN (PAT with contents:read).
  prepare-wallet-api2:
    name: Prepare wallet-api2 dist
    if: ${{ vars.WALTID_IDENTITY_REPO != '' && vars.SECDSA_ADAPTER_REPO != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo
        uses: actions/checkout@v4

      - name: Checkout waltid-identity
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.WALTID_IDENTITY_REPO }}
          ref: ${{ vars.WALTID_IDENTITY_REF || 'main' }}
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          path: .deps/waltid-identity

      - name: Checkout secdsa-waltid-adapter
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SECDSA_ADAPTER_REPO }}
          ref: ${{ vars.SECDSA_ADAPTER_REF || 'main' }}
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          path: .deps/secdsa-waltid-adapter

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build wallet-api2 dist
        env:
          WALTID_IDENTITY_PATH: ${{ github.workspace }}/.deps/waltid-identity
          SECDSA_ADAPTER_PATH: ${{ github.workspace }}/.deps/secdsa-waltid-adapter
        run: ./scripts/build-wallet-api2.sh

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: wallet-api2-dist
          path: wallet-api2/dist
          retention-days: 1

  docker-wallet-api2:
    name: Docker / GHCR (wallet-api2)
    needs: prepare-wallet-api2
    if: ${{ vars.WALTID_IDENTITY_REPO != '' && vars.SECDSA_ADAPTER_REPO != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: wallet-api2-dist
          path: wallet-api2/dist

      - name: Image name
        id: image
        run: |
          owner_repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${owner_repo}/wallet-api2" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./wallet-api2
          file: ./wallet-api2/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wallet-api2
          cache-to: type=gha,mode=max,scope=wallet-api2
