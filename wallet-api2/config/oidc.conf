# OIDC login for the Web Wallet (not OID4VCI/VP).
# Provider: SURF pilot — https://oidc.pilot1.sram.surf.nl/.well-known/openid-configuration
#
# In this demo stack, OIDC is handled by the Nuxt web-wallet Nitro routes
# (not wallet-api2). Register this redirect URI at the OIDC client:
#   http://localhost:7115/wallet-api/auth/oidc-session
#
# Set OIDC_CLIENT_ID / OIDC_CLIENT_SECRET in .env (passed to web-wallet).

# Browser-facing wallet URL (Nuxt SECDSA PIN wallet).
publicBaseUrl = "http://localhost:7115"

providerName = "surf-sram"
oidcRealm = "https://oidc.pilot1.sram.surf.nl"
oidcJwks = "https://oidc.pilot1.sram.surf.nl/.well-known/jwks.json"
oidcScopes = ["openid", "email", "profile"]

authorizeUrl = "https://oidc.pilot1.sram.surf.nl/authorize"
accessTokenUrl = "https://oidc.pilot1.sram.surf.nl/token"
# SRAM discovery has no end_session_endpoint — soft-logout back to the wallet login.
logoutUrl = "http://localhost:7115/login"

clientId = "${OIDC_CLIENT_ID}"
clientSecret = "${OIDC_CLIENT_SECRET}"

jwksCache = {
    cacheSize = 10
    cacheExpirationHours = 24
    rateLimit = {
        bucketSize = 10
        refillRateMinutes = 1
    }
}
