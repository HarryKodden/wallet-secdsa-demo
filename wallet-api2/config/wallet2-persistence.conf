# Flat root keys — ConfigManager loads config/wallet2-persistence.conf
# and maps fields onto Wallet2PersistenceConfig (same pattern as web.conf).
# Nested `wallet2-persistence { ... }` caused Hoplite to miss jdbcUrl and
# silently fall back to jdbc:sqlite:wallet2.db (wiped on container recreate).

jdbcUrl = "jdbc:postgresql://${POSTGRES_DB_HOST}:5432/${DB_NAME}"
driverClassName = "org.postgresql.Driver"
username = "${DB_USERNAME}"
password = "${DB_PASSWORD}"
maximumPoolSize = 10
minimumIdle = 2
