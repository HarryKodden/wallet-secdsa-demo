# Self-contained walt.id OID4VC 1.0 + SECDSA demo stack.
# Educational only — SECDSA is patent-encumbered (see SECDSA USAGE.md).

name: wallet-secdsa-demo

services:
  secdsa:
    image: ghcr.io/harrykodden/secdsa:latest
    ports:
      - "${SECDSA_HOST_PORT:-18080}:8080"
    environment:
      ADDR: ":8080"
    # Memory WSCD lab (not SoftHSM). Educational / patent-encumbered.

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-waltid}
      POSTGRES_USER: ${DB_USERNAME:-waltid}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-waltid}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-waltid} -d ${DB_NAME:-waltid}"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    ports:
      - "${WALLET_API2_HOST_PORT:-7006}:7006"
      - "${ISSUER_API2_HOST_PORT:-7005}:7005"
      - "${VERIFIER_API2_HOST_PORT:-7004}:7004"
      - "${WEB_WALLET_HOST_PORT:-7115}:7115"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - wallet-api2
      - issuer-api2
      - verifier-api2
      - web-wallet

  wallet-api2:
    build:
      context: ./wallet-api2
      dockerfile: Dockerfile
    image: wallet-secdsa-demo/wallet-api2:local
    env_file: .env
    environment:
      WALLET_API2_PORT: "7006"
      POSTGRES_DB_HOST: postgres
      DB_NAME: ${DB_NAME:-waltid}
      DB_USERNAME: ${DB_USERNAME:-waltid}
      DB_PASSWORD: ${DB_PASSWORD:-waltid}
      SERVICE_HOST: ${SERVICE_HOST:-host.docker.internal}
      # SoftHSM activate on PIN unlock / SIGN (WscaClient)
      WSCA_BASE_URL: ${WSCA_INTERNAL_URL:-http://secdsa:8080}
      WSCA_ACCOUNT_ID: ${WSCA_ACCOUNT_ID:-citizen-42}
      # Persist email/password accounts across wallet-api2 restarts (Postgres already holds wallets/creds)
      WALLET2_ACCOUNT_STORE_PATH: ${WALLET2_ACCOUNT_STORE_PATH:-/data/wallet2-accounts.json}
    volumes:
      - ./wallet-api2/config:/waltid-wallet-api2/config:ro
      - wallet-api2-accounts:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      secdsa:
        condition: service_started

  issuer-api2:
    # Default: Docker Hub walt.id. Override with CI GHCR image, e.g.
    # ISSUER_API2_IMAGE=ghcr.io/harrykodden/wallet-secdsa-demo/issuer-api2:latest
    image: ${ISSUER_API2_IMAGE:-${IMAGE_PREFIX:-}waltid/issuer-api2:${VERSION_TAG:-stable}}
    env_file: .env
    environment:
      ISSUER_API2_PORT: "7005"
      SERVICE_HOST: ${SERVICE_HOST:-host.docker.internal}
      # User-login AS for AUTHORIZED / authorization_code offers (authentication-service.conf)
      ISSUER_AS_NAME: ${ISSUER_AS_NAME:-keycloak}
      ISSUER_AS_AUTHORIZE_URL: ${ISSUER_AS_AUTHORIZE_URL:-https://keycloak.demo.walt.id/realms/mynewrealm/protocol/openid-connect/auth}
      ISSUER_AS_TOKEN_URL: ${ISSUER_AS_TOKEN_URL:-https://keycloak.demo.walt.id/realms/mynewrealm/protocol/openid-connect/token}
      ISSUER_AS_CLIENT_ID: ${ISSUER_AS_CLIENT_ID:-issuer_api}
      ISSUER_AS_CLIENT_SECRET: ${ISSUER_AS_CLIENT_SECRET:-Y0DyNhF4NgpOS6VMRUtl0JtvxrRYQD4s}
    volumes:
      - ./issuer-api2/config:/waltid-issuer-api2/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  verifier-api2:
    # Default: Docker Hub walt.id. Override with CI GHCR image, e.g.
    # VERIFIER_API2_IMAGE=ghcr.io/harrykodden/wallet-secdsa-demo/verifier-api2:latest
    image: ${VERIFIER_API2_IMAGE:-${IMAGE_PREFIX:-}waltid/verifier-api2:${VERSION_TAG:-stable}}
    env_file: .env
    environment:
      VERIFIER_API2_PORT: "7004"
      SERVICE_HOST: ${SERVICE_HOST:-host.docker.internal}
    volumes:
      - ./verifier-api2/config:/waltid-verifier-api2/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web-wallet:
    build:
      context: ./web-wallet
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_APP_VERSION: ${APP_VERSION:-DEV}
        NUXT_PUBLIC_WSCA_ACCOUNT_ID: ${WSCA_ACCOUNT_ID:-citizen-42}
        NUXT_PUBLIC_WSCA_BASE_URL: ${WSCA_INTERNAL_URL:-http://secdsa:8080}
        NUXT_PUBLIC_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
        NUXT_PUBLIC_OIDC_AUTHORIZE_URL: ${NUXT_PUBLIC_OIDC_AUTHORIZE_URL:-https://oidc.pilot1.sram.surf.nl/authorize}
        NUXT_PUBLIC_OIDC_REDIRECT_URI: ${NUXT_PUBLIC_OIDC_REDIRECT_URI:-http://localhost:7115/wallet-api/auth/oidc-session}
        NUXT_OIDC_TOKEN_URL: ${NUXT_OIDC_TOKEN_URL:-https://oidc.pilot1.sram.surf.nl/token}
        NUXT_PUBLIC_OIDC_SCOPES: ${NUXT_PUBLIC_OIDC_SCOPES:-openid email profile}
        NUXT_PUBLIC_OID4VCI_CLIENT_ID: ${OID4VCI_CLIENT_ID:-wallet-secdsa-demo}
        NUXT_PUBLIC_OID4VCI_REDIRECT_URI: ${OID4VCI_REDIRECT_URI:-http://localhost:7115/oid4vci/callback}
        WALLET_API2_PROXY: http://wallet-api2:7006
    image: wallet-secdsa-demo/web-wallet:local
    environment:
      HOST: 0.0.0.0
      PORT: "7115"
      NUXT_PUBLIC_APP_VERSION: ${APP_VERSION:-DEV}
      NUXT_PUBLIC_WSCA_ACCOUNT_ID: ${WSCA_ACCOUNT_ID:-citizen-42}
      NUXT_PUBLIC_WSCA_BASE_URL: ${WSCA_INTERNAL_URL:-http://secdsa:8080}
      NUXT_PUBLIC_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      NUXT_PUBLIC_OIDC_AUTHORIZE_URL: ${NUXT_PUBLIC_OIDC_AUTHORIZE_URL:-https://oidc.pilot1.sram.surf.nl/authorize}
      NUXT_PUBLIC_OIDC_REDIRECT_URI: ${NUXT_PUBLIC_OIDC_REDIRECT_URI:-http://localhost:7115/wallet-api/auth/oidc-session}
      NUXT_OIDC_TOKEN_URL: ${NUXT_OIDC_TOKEN_URL:-https://oidc.pilot1.sram.surf.nl/token}
      NUXT_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      NUXT_PUBLIC_OIDC_SCOPES: ${NUXT_PUBLIC_OIDC_SCOPES:-openid email profile}
      NUXT_PUBLIC_OID4VCI_CLIENT_ID: ${OID4VCI_CLIENT_ID:-wallet-secdsa-demo}
      NUXT_PUBLIC_OID4VCI_REDIRECT_URI: ${OID4VCI_REDIRECT_URI:-http://localhost:7115/oid4vci/callback}
      # Nitro Lab proxies → compose DNS (not browser-facing)
      ISSUER_API2_INTERNAL_URL: ${ISSUER_API2_INTERNAL_URL:-http://issuer-api2:7005}
      VERIFIER_API2_INTERNAL_URL: ${VERIFIER_API2_INTERNAL_URL:-http://verifier-api2:7004}
      WALLET_API2_PROXY: ${WALLET_API2_PROXY:-http://wallet-api2:7006}
      # Lab auth-code: mirror issuer AS (non-secret) + enable flag
      ISSUER_AS_AUTHORIZE_URL: ${ISSUER_AS_AUTHORIZE_URL:-}
      ISSUER_AS_TOKEN_URL: ${ISSUER_AS_TOKEN_URL:-}
      ISSUER_AS_CLIENT_ID: ${ISSUER_AS_CLIENT_ID:-}
      LAB_ENABLE_AUTH_CODE: ${LAB_ENABLE_AUTH_CODE:-}
    depends_on:
      - wallet-api2
      - secdsa
      - issuer-api2
      - verifier-api2

volumes:
  postgres-data:
  wallet-api2-accounts:
