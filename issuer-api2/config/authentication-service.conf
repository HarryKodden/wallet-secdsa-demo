# External IdP used when issuer-api2 runs OID4VCI authorization_code (AUTHORIZED offers).
# Wallet hits issuer /openid4vci/authorize; issuer may send the user here to log in.
#
# Override via .env (see .env.example). Defaults = walt.id public demo Keycloak.
name = "${ISSUER_AS_NAME}"
authorizeUrl = "${ISSUER_AS_AUTHORIZE_URL}"
accessTokenUrl = "${ISSUER_AS_TOKEN_URL}"
clientId = "${ISSUER_AS_CLIENT_ID}"
clientSecret = "${ISSUER_AS_CLIENT_SECRET}"
defaultScopes = ["openid", "profile"]
forwardIssuerStateToAuthorizationServer = false
